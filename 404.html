<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rift Audio</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct visit or
      // refresh on a player route (e.g. /g/123/music) 404s. This stashes
      // the intended path and bounces to "/", where index.html restores it.
      var path = location.pathname + location.search + location.hash;
      sessionStorage.redirect = path;
      location.replace(location.protocol + "//" + location.host + "/");
    </script>
  </head>
  <body></body>
</html>
