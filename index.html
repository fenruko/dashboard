<!doctype html>
<html lang="en" data-api-base="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090e" />
    <meta
      name="description"
      content="Rift Audio is a fast, synced music workspace for your browser and Discord bot."
    />
    <meta name="color-scheme" content="dark" />
    <title>Rift Audio — in sync with your sound</title>
    <link rel="icon" href="/assets/rift-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/rift-audio.css" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <noscript>
      <div style="font: 16px system-ui; color: white; background: #09090e; min-height: 100vh; padding: 3rem">
        Rift Audio needs JavaScript to keep your player, queue, and Discord bot in sync.
      </div>
    </noscript>
    <script>
      // Preserve a direct /g/:guildId/music visit after GitHub Pages' 404 fallback.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <script type="module" src="/assets/rift-audio.js"></script>
  </body>
</html>
